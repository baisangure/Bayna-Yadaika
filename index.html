<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Darul Hadis</title>
    <style>
        :root{
            --bg:#f3f7f5; --card:#ffffff; --text:#111827; --muted:#6b7280;
            --line:#e5e7eb; --green:#14532d; --green2:#166534; --soft:#e7f3ec;
            --shadow:0 10px 24px rgba(0,0,0,.07); --radius:22px;
        }
        *{box-sizing:border-box}
        body{margin:0;font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);padding-bottom:100px}
        header{padding:18px;font-size:32px;font-weight:900;text-align:right}
        .sub{padding:0 18px;color:var(--muted);font-size:13px;text-align:right}
        .wrap{max-width:600px;margin:auto;padding:12px}
        .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
        .hero{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff}
        .title{font-size:26px;font-weight:900}
        .title2{font-size:20px;font-weight:900}
        .hidden{display:none !important}
        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .btn{width:100%;min-height:52px;border:0;border-radius:18px;font-size:16px;font-weight:800;cursor:pointer}
        .green{background:var(--green);color:#fff}
        .light{background:#f3f4f6;color:#111827}
        .soft{background:var(--soft);color:var(--green)}
        .nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);padding:10px;border-top:1px solid var(--line);gap:10px}
        .ar{font-size:46px;text-align:center;direction:rtl;margin:20px 0}
        .unitBox{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;background:#fff}
        .progress{height:10px;border-radius:10px;background:#e5e7eb;overflow:hidden;margin:10px 0}
        #progressBar{height:100%;width:0%;background:var(--green);transition:0.3s}
    </style>
</head>
<body>

<header>دار الحديث</header>
<div class="sub">Помощник по арабскому: словарь и карточки</div>

<div class="wrap">
    <section id="home">
        <div class="card hero"><div class="title">Библиотека</div></div>
        <div class="grid2">
            <div class="card">
                <div class="title2">بين يديك</div>
                <br>
                <button class="btn green" onclick="showPage('books')">Открыть</button>
            </div>
            <div class="card">
                <div class="title2">البناء</div>
                <div class="small">Скоро</div>
                <br>
                <button class="btn soft">Открыть</button>
            </div>
            <div class="card">
                <div class="title2">الآجرومية</div>
                <div class="small">Скоро</div>
                <br>
                <button class="btn soft">Открыть</button>
            </div>
            <div class="card">
                <div class="title2">الأربعون</div>
                <div class="small">Скоро</div>
                <br>
                <button class="btn soft">Открыть</button>
            </div>
        </div>
    </section>

    <section id="books" class="hidden">
        <div class="card">
            <div class="title">Выберите часть</div>
            <div id="partsList" style="margin-top:15px"></div>
            <button class="btn light" onclick="showPage('home')">Назад</button>
        </div>
    </section>

    <section id="units" class="hidden">
        <div class="card">
            <div id="unitsTitle" class="title">Вахьдаты</div>
            <div id="unitsList" style="margin-top:15px"></div>
            <button class="btn light" onclick="showPage('books')">Назад</button>
        </div>
    </section>

    <section id="study" class="hidden">
        <div class="card">
            <div id="studyTitle" class="title2">Урок</div>
            <div class="progress"><div id="progressBar"></div></div>
            <div id="front" class="ar"></div>
            <div id="back" style="text-align:center; min-height:30px; color:gray"></div>
            <br>
            <button class="btn green" onclick="flipCard()">Показать ответ</button>
            <div class="grid2" style="margin-top:10px">
                <button class="btn light" onclick="nextCard()">Дальше</button>
                <button class="btn soft" onclick="showPage('units')">Выход</button>
            </div>
        </div>
    </section>
</div>

<nav class="nav">
    <button class="btn light" onclick="showPage('home')">Главная</button>
    <button class="btn light" onclick="showPage('books')">Учёба</button>
    <button class="btn light" onclick="alert('Статистика скоро')">Статы</button>
</nav>

<script>
    const unit1 = [ ['اِثْنَانِ','Два'], ['أَخٌ','Брат'], ['أُخْتٌ','Сестра'], ['أَنَا','Я'], ['أَنْتَ','Ты'] ];
    const unit2 = [ ['أَبٌ','Отец'], ['اِبْنٌ','Сын'], ['أُمٌّ','Мать'], ['أَيْنَ','Где'] ];

    let queue = [];
    let current = null;

    function $(id) { return document.getElementById(id); }

    function showPage(id) {
        document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
        $(id).classList.remove('hidden');
        if(id === 'books') renderParts();
    }

    function renderParts() {
        $('partsList').innerHTML = `<div class="unitBox">
            <div class="title2">Часть 1</div>
            <button class="btn green" style="margin-top:10px" onclick="openPart(1)">Открыть</button>
        </div>`;
    }

    function openPart(p) {
        let html = '';
        for(let u=1; u<=2; u++) {
            html += `<div class="unitBox">
                <b>Вахьда ${u}</b>
                <button class="btn green" style="margin-top:10px" onclick="startLesson(${u})">Начать</button>
            </div>`;
        }
        $('unitsList').innerHTML = html;
        showPage('units');
    }

    function startLesson(u) {
        const words = (u === 1) ? unit1 : unit2;
        queue = [...words].sort(() => Math.random() - 0.5);
        showPage('study');
        nextCard();
    }

    function nextCard() {
        if (queue.length === 0) {
            $('front').innerText = '✅';
            $('back').innerText = 'Урок окончен!';
            $('progressBar').style.width = '100%';
            return;
        }
        current = queue.shift();
        $('front').innerText = current[0];
        $('back').innerText = '';
        $('progressBar').style.width = '30%';
    }

    function flipCard() {
        if(current) $('back').innerText = current[1];
    }

    showPage('home');
</script>
</body>
</html>
