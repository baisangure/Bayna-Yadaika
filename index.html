<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #f0f0f0; font-family: sans-serif; }
        .header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; min-height: 300px; background: white; margin: 10px; border-radius: 10px; }
        .nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #fff; border-top: 1px solid #ccc; }
        .nav-btn { flex: 1; padding: 15px; text-align: center; border: none; background: none; }
        .active-tab { color: blue; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">Darul Hadis TEST</div>

    <div id="page1" class="content">ЭКРАН 1: Если ты это видишь, значит всё ОK!</div>
    <div id="page2" class="content" style="display:none">ЭКРАН 2: Ты переключил вкладку!</div>

    <div class="nav">
        <button class="nav-btn" onclick="show(1)">Вкладка 1</button>
        <button class="nav-btn" onclick="show(2)">Вкладка 2</button>
    </div>

    <script>
        function show(num) {
            document.getElementById('page1').style.display = (num === 1) ? 'block' : 'none';
            document.getElementById('page2').style.display = (num === 2) ? 'block' : 'none';
        }
    </script>
</body>
</html>
