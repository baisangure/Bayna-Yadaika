<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Darul Hadis Pro</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            font-family: sans-serif; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* Заголовок */
        .header { 
            background: var(--primary); 
            color: white; 
            padding: 15px; 
            text-align: center; 
            font-weight: bold; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Контент */
        .main-content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            padding-bottom: 80px; 
        }

        .view { display: none; }
        .view.active { display: block; }

        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
        }

        /* Арабский текст */
        .arabic { 
            direction: rtl; 
            font-size: 24px; 
            text-align: right; 
            margin: 10px 0;
            color: #2c3e50;
        }

        /* Навигация */
        .nav { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            display: flex; 
            background: white; 
            border-top: 1px solid #ddd; 
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-btn { 
            flex: 1; 
            padding: 15px 5px; 
            border: none; 
            background: none; 
            font-size: 12px; 
            color: #7f8c8d; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        .nav-btn.active { color: var(--accent); font-weight: bold; }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }

        button.action-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header" id="header-title">Darul Hadis Pro</div>

    <div class="main-content">
        <div id="home" class="view active">
            <div class="card">
                <h3>Твой прогресс</h3>
                <p>Сегодня выучено слов: 0</p>
                <button class="action-btn" onclick="showView('study')">Начать учиться</button>
            </div>
        </div>

        <div id="study" class="view">
            <div class="card">
                <div class="arabic">صِلَةُ الْمَوْصُولِ</div>
                <p><b>Тема:</b> Грамматика (Силятуль мавсуль)</p>
                <hr>
                <p>Пример из поэзии Ан-Набиги:</p>
                <div class="arabic">فَإِنَّكَ كَاللَّيْلِ الَّذِي هُوَ مُدْرِكِي</div>
            </div>
        </div>

        <div id="library" class="view">
            <div class="card">
                <h3>Библиотека</h3>
                <p>Твои сохраненные материалы появятся здесь.</p>
            </div>
        </div>
    </div>

    <nav class="nav">
        <button class="nav-btn active" onclick="showView('home', this)">
            <span class="nav-icon">🏠</span>Главная
        </button>
        <button class="nav-btn" onclick="showView('study', this)">
            <span class="nav-icon">📚</span>Учеба
        </button>
        <button class="nav-btn" onclick="showView('library', this)">
            <span class="nav-icon">📖</span>Книги
        </button>
    </nav>

    <script>
        function showView(viewId, btn) {
            // Скрываем все вкладки
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            // Убираем активный класс у кнопок
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            // Показываем нужную
            document.getElementById(viewId).classList.add('active');
            
            // Если нажата кнопка в меню, подсвечиваем её
            if (btn) {
                btn.classList.add('active');
            } else {
                // Если переход по кнопке "Начать", подсвечиваем иконку в меню
                document.querySelectorAll('.nav-btn')[1].classList.add('active');
                document.querySelectorAll('.nav-btn')[0].classList.remove('active');
            }
        }
    </script>
</body>
</html>
